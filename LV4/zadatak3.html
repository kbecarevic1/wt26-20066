<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <title>Zadatak 3 - Evidencija troškova</title>
        <style>
            #greska {
                color: red;
            }
            table {
                border-collapse: collapse;
                margin-top: 10px;
            }
            th,
            td {
                border: 1px solid black;
                padding: 5px 10px;
            }
            th {
                background-color: #ddd;
            }
            td:nth-child(2) {
                text-align: right;
            }
            #redZbir td {
                font-weight: bold;
                background-color: #f2f2f2;
            }
        </style>
        <script src="zadatak3.js"></script>
    </head>
    <body>
        <h2>Evidencija troškova</h2>

        <form id="forma" onsubmit="return false;">
            Naziv: <input type="text" id="naziv" /> Iznos (KM):
            <input type="text" id="iznos" placeholder="npr. 12.50" />
            <input type="button" value="Dodaj" onclick="dodaj()" />
        </form>

        <p id="greska"></p>
        <p id="brojStavki"></p>

        <table id="tabela">
            <tr>
                <th>Naziv</th>
                <th>Iznos (KM)</th>
            </tr>
            <tr>
                <td>Kafa</td>
                <td>3.00</td>
            </tr>
            <tr>
                <td>Užina</td>
                <td>7.50</td>
            </tr>
            <tr>
                <td>Karta za tramvaj</td>
                <td>1.80</td>
            </tr>
            <tr id="redZbir">
                <td>Ukupno</td>
                <td id="zbir"></td>
            </tr>
        </table>
    </body>
</html>
