<!DOCTYPE html>
<html>

<head>
    <title>Zadatak 2</title>
</head>

<body>
    <h1>Narudzba pizze</h1>

    <form>
        <label for="ime">Ime:</label>
        <input type="text" id="ime" name="ime" required><br>

        <label for="adresa">Adresa:</label>
        <input type="text" id="adresa" name="adresa" required><br>

        Velicina:
        <input type="radio" id="mala" name="velicina" value="mala">
        <label for="mala">Mala</label>
        <input type="radio" id="velika" name="velicina" value="velika">
        <label for="velika">Velika</label><br>

        Dodaci:
        <input type="checkbox" id="sunka" name="dodaci" value="sunka">
        <label for="sunka">Sunka</label>
        <input type="checkbox" id="gljive" name="dodaci" value="gljive">
        <label for="gljive">Gljive</label><br>

        <input type="submit" value="Naruci">
    </form>

    <p>Primjer 1: Amra, Titova 5, Mala, dodaci: Sunka i Gljive</p>
    <p>Primjer 2: Haris, Velika, bez dodataka</p>
</body>

</html>
